
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>

    <h1>Contact</h1>

    <form id="contactForm">

        <fieldset>
            <legend>Contact Me</legend>

            <table>
                <tr>
                    <td><label for="firstName">First Name:</label></td>
                    <td>
                        <input type="text" id="firstName"
                               name="firstName" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="lastName">Last Name:</label></td>
                    <td>
                        <input type="text" id="lastName"
                               name="lastName" required>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender"
                               value="male" required> Male

                        <input type="radio" name="gender"
                               value="female"> Female
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input type="email" id="email"
                               name="email" required>
                    </td>
                </tr>

                <tr>
                    <td>Reason of Contact:</td>
                    <td>
                        <input type="checkbox" name="reason"
                               value="Projects"> Project

                        <input type="checkbox" name="reason"
                               value="Thesis"> Thesis

                        <input type="checkbox" name="reason"
                               value="Job"> Job
                    </td>
                </tr>

                <tr>
                    <td>Topics:</td>
                    <td>
                        <input type="checkbox" name="topic"
                               value="Web Development"> Web Development

                        <input type="checkbox" name="topic"
                               value="Mobile Development"> Mobile Development

                        <input type="checkbox" name="topic"
                               value="AI/ML Development"> AI/ML Development
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="consultation">Consultation Date:</label>
                    </td>
                    <td>
                        <input type="datetime-local" id="consultation"
                               name="consultation" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>

        </fieldset>

    </form>

    <p id="message"></p>

    <br>
    <a href="index.html">Back</a>

    <script>
        const form = document.getElementById("contactForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            message.textContent =
                "Form submitted successfully!";

            message.style.color = "green";
        });
    </script>

</body>
</html>
